name: Valid Workflow
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build root
        run: npm run build
      - name: Test unit
        run: npm run test:unit
      - name: Run script
        run: node scripts/build.js
      - name: Verify shell
        run: bash scripts/verify.sh
      - name: Validate Python
        run: python3 scripts/validate.py
